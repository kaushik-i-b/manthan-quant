services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  frontend:
    image: node:22
    working_dir: /app
    volumes: ["./frontend:/app"]
    ports: ["43123:43123"]
    command: bash -c "npm install && npm run dev"
